<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Splitter</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../../index.html">← Portfolio</a><div class="head"><span>BILL CALCULATOR</span><h1>Split the bill.<br><i>Fair and simple.</i></h1></div><section class="layout"><div class="card"><h2>People</h2><div id="people"></div><button id="addPerson" class="button">+ Add person</button><h2 class="section-title">Items</h2><div id="items"></div><button id="addItem" class="button">+ Add item</button><div class="options"><label>Tax % <input id="tax" type="number" min="0" value="5"></label><label>Tip % <input id="tip" type="number" min="0" value="0"></label></div><button id="calc" class="primary">Calculate & settle</button></div><aside class="card result"><span>RESULT</span><div id="total">₹0.00</div><div id="summary"></div><div id="settlements"></div></aside></section></main><script src="script.js"></script></body></html>
