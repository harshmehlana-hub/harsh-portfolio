<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Splitter</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../../index.html">← Portfolio</a><div class="head"><span>BILL CALCULATOR</span><h1>Split the bill.<br><i>Fair and simple.</i></h1></div><section class="layout"><div class="card"><label>People <input id="people" type="number" min="1" value="2"></label><div id="items"></div><button id="add" class="button">+ Add item</button><div class="options"><label>Tax % <input id="tax" type="number" min="0" value="5"></label><label>Tip % <input id="tip" type="number" min="0" value="0"></label></div><button id="calc" class="primary">Calculate split</button></div><aside class="card result"><span>RESULT</span><div id="total">₹0.00</div><div id="shares"></div></aside></section></main><script src="script.js"></script></body></html>
