<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathFinder — Algorithm Visualizer</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html">← Harsh's Portfolio</a><h1>PathFinder</h1><p>Watch algorithms solve a maze, one step at a time.</p></header><main><section class="panel controls"><label>Algorithm <select id="algo"><option value="bfs">Breadth First Search</option><option value="dfs">Depth First Search</option></select></label><label>Speed <input id="speed" type="range" min="10" max="200" value="70"></label><button id="run">Run</button><button id="clear">Clear</button><span id="status">Ready</span></section><section class="panel"><div id="grid" class="grid"></div></section><p class="hint">Click cells to add or remove walls. Start is green, target is coral.</p></main><script src="script.js"></script></body></html>
